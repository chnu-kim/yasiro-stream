name: CI

# PR마다 돌고, deploy.yml이 배포 전에 같은 검사를 불러 쓴다(workflow_call).
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint --max-warnings 0

      # PageProps·RouteContext 같은 라우트 타입은 next typegen이 만든다(.next/types).
      - name: Typecheck
        run: pnpm typecheck

      # src/lib/games/**, src/lib/awards/**, chzzk-category.ts는 100% threshold. 미달하면 실패한다.
      - name: Test (coverage)
        run: pnpm test:coverage

      # opennextjs 번들링 오류(NextResponse·runtime 선언 등)는 빌드에서만 드러난다.
      - name: Build worker
        run: pnpm build:worker
